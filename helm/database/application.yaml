apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/muthuri-dev/devops-eks-helm-terraform-ansible.git
    targetRevision: main
    path: helm/database
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
