apiVersion: v1
kind: Service
metadata:
  name: postgresql-db-lb
  namespace: databases
  labels:
    app: postgresql
    managed-by: argocd
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    postgresql: postgresql-db
    role: primary
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
