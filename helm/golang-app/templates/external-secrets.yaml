# SecretStore - connects to Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "..labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.address | quote }}
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ include "..serviceAccountName" . }}

---
# ExternalSecret - fetches database secrets from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "..fullname" . }}-database-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "..labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ include "..fullname" . }}-database-secrets
    creationPolicy: Owner
  data:
  - secretKey: DB_HOST
    remoteRef:
      key: database
      property: DB_HOST
  - secretKey: DB_PORT
    remoteRef:
      key: database
      property: DB_PORT
  - secretKey: DB_NAME
    remoteRef:
      key: database
      property: DB_NAME
  - secretKey: DB_USER
    remoteRef:
      key: database
      property: DB_USER
  - secretKey: DB_PASSWORD
    remoteRef:
      key: database
      property: DB_PASSWORD
  - secretKey: DB_SSL_MODE
    remoteRef:
      key: database
      property: DB_SSL_MODE
  - secretKey: PORT
    remoteRef:
      key: database
      property: PORT